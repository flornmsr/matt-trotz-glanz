<form class="form container" [formGroup]="loginForm" *ngIf="loginForm">
    <div class="row login">
        <mat-card class="default-card">
            <mat-card-header>
                <mat-card-title class="info-card-header">Login</mat-card-title>
                <mat-card-subtitle><h1>Matt trotz Glanz</h1><h2 style="display: none;">Depression im Spitzensport-Ein Tabuthema</h2></mat-card-subtitle>
              </mat-card-header>
              <mat-card-content>
                <mat-form-field class="form-control col-12" appearance="outline">
                    <mat-label>email</mat-label>
                    <input matInput placeholder="marco.pfeuti@buetzerbuebe.com" formControlName="email" required autoComplete="off">
                    <mat-error *ngIf="loginForm.get('email').invalid">{{getErrorMessage(loginForm.get('email'))}}</mat-error>
                </mat-form-field>
        
                <mat-form-field class="form-control col-12" appearance="outline">
                    <mat-label>password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" required>
                    <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
                <button mat-flat-button color="primary" type="submit" (click)="authenticationService.signIn(loginForm.value)" [disabled]="loginForm.invalid">Login</button>
              </mat-card-content>
        </mat-card>
    </div>  
</form>
