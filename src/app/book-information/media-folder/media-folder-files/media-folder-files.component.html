<mat-list>
  <ng-container *ngIf="type === MEDIATYPE.FILE">
    <a *ngFor="let file of list" [download]="file.name" [href]="urlToFile + file.path">
      <mat-list-item>
        <mat-icon mat-list-icon>note</mat-icon>
        <div mat-line>{{file.name}}</div>
        <div mat-line> {{file.updated | date}} </div>
      </mat-list-item>
    </a>
  </ng-container>

  <ng-container *ngIf="type === MEDIATYPE.LINK">
    <a *ngFor="let link of list" [href]="link.path" target="_blank">
      <mat-list-item>
        <mat-icon mat-list-icon>link</mat-icon>
        <div mat-line>{{link.name}}</div>
        <div mat-line> {{link.updated | date}} </div>
      </mat-list-item>
    </a>
  </ng-container>
  
</mat-list>
